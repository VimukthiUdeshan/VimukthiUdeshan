name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Manual "Run workflow" button in Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats SVG
        uses: jstrieb/github-stats@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: VimukthiUdeshan
          OUTPUT_PATH: assets/stats.svg
          TITLE_COLOR: "#60A5FA"
          TEXT_COLOR: "#CBD5E1"
          ICON_COLOR: "#38BDF8"
          BG_COLOR: "#0F172A"
          BORDER_COLOR: "#0F172A"
