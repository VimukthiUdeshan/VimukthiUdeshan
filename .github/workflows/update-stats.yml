name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Manual "Run workflow" button in Actions tab

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Stats SVG
        run: |
          mkdir -p assets
          curl -s -L -A "Mozilla/5.0" "https://vercel.app" -o assets/temp.svg
          if grep -q "<svg" assets/temp.svg; then
            mv assets/temp.svg assets/stats.svg
          else
            echo "Error: Downloaded file is not a valid SVG"
            cat assets/temp.svg
            exit 1
          fi

      - name: Commit updated SVG
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update GitHub stats" && git push)
